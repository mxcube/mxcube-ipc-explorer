[project]
name = "mxcube-ipc-explorer"
version = "0.1.0"
description = "Interactive TUI for browsing a beamline over mxcubecore.ipc's"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pinned <7: textual>=7 requires rich>=14.2, which conflicts with
    # flask-limiter (a mxcubeweb-server dependency, pinned to rich<14) in
    # the shared env this is meant to run in alongside mxcubecore/mxcubeweb.
    "textual>=6.0.0,<7.0.0",
    # Used to validate call args against a method's schema (from
    # mxcubecore.ipc's _debug_describe_role) before sending.
    "jsonschema>=4.17.1",
    "mxcube-ipc-client[nanomq] @ git+https://github.com/mxcube/mxcube-ipc-client.git",
]

[project.scripts]
mxcube-ipc-explorer = "mxcube_ipc_explorer.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
